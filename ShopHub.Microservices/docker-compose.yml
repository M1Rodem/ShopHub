services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: shophub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shophub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: .
      dockerfile: CatalogService/Dockerfile
    container_name: shophub-catalog
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Data Source=/app/data/catalog.db"
      ConnectionStrings__Redis: "redis:6379"
    volumes:
      - ./data/catalog:/app/data
    ports:
      - "5001:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    container_name: shophub-order
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Data Source=/app/data/orders.db"
      Services__Catalog: "http://catalog-service:8080"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: guest
      RabbitMQ__Pass: guest
    volumes:
      - ./data/orders:/app/data
    ports:
      - "5002:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    container_name: shophub-notification
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: guest
      RabbitMQ__Pass: guest
    ports:
      - "5003:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy